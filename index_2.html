<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorador de Pokémon</title>
    <meta name="description" content="Explora diferentes Pokémon y descubre información básica sobre ellos.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, input, select { font-family: 'Work Sans', sans-serif; }
        h1, h2, h3, .font-display, button { font-family: 'Baloo 2', cursive; }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
</head>

<body class="min-h-screen bg-[#EDEFF3] text-[#1F2340] leading-relaxed">

    <header class="relative overflow-hidden border-b-[6px] border-[#1F2340] bg-[#E3350D] px-6 pb-14 pt-12 text-center text-[#FFF6E9]">
        <div class="absolute -right-[70px] -top-[70px] flex h-[240px] w-[240px] items-center justify-center rounded-full border-[26px] border-white/15" aria-hidden="true">
            <div class="h-[45%] w-[45%] rounded-full bg-white/15"></div>
        </div>
        <h1 class="relative mb-2 text-[clamp(2rem,5vw,3.2rem)] font-extrabold tracking-wide">Explorador de Pokémon</h1>
        <p class="relative mx-auto max-w-[46ch] text-[1.05rem] text-[#FFE8D6]">Descubre diferentes Pokémon y conoce algunos datos interesantes sobre ellos.</p>
    </header>

    <nav class="relative mx-auto -mt-6 mb-8 flex w-11/12 max-w-fit flex-wrap justify-center gap-2 rounded-[20px] bg-white p-2 shadow-[0_8px_20px_rgba(31,35,64,0.15)] sm:gap-3 sm:rounded-full">
        <a href="#inicio" class="rounded-full px-4 py-2 text-sm font-semibold text-[#1F2340] transition-colors hover:bg-[#FFCB05] sm:px-5 sm:text-base">Inicio</a>
        <a href="#favoritos" class="rounded-full px-4 py-2 text-sm font-semibold text-[#1F2340] transition-colors hover:bg-[#FFCB05] sm:px-5 sm:text-base">Favoritos</a>
        <a href="#acerca" class="rounded-full px-4 py-2 text-sm font-semibold text-[#1F2340] transition-colors hover:bg-[#FFCB05] sm:px-5 sm:text-base">Acerca de</a>
    </nav>

    <main id="inicio" class="mx-auto max-w-[980px] px-6 pb-16">
        <section class="mb-12 rounded-[28px] border-[6px] border-[#B92A0B] bg-[#1F2340] px-[clamp(1.25rem,4vw,2.5rem)] py-8 text-[#F4F6FF]">
            <h2 class="mb-4 text-[1.6rem] font-bold text-[#F4F6FF]">Buscar Pokémon</h2>
            <form class="flex flex-col gap-4 sm:flex-row sm:items-end sm:gap-5" role="search">
                <div class="flex flex-1 flex-col gap-1.5 sm:basis-[200px]">
                    <label for="busqueda" class="text-[0.85rem] font-semibold text-[#C7CCEE]">Buscar Pokémon</label>
                    <input type="text" id="busqueda" placeholder="Ejemplo: Pikachu"
                           class="w-full rounded-[10px] bg-[#2C3161] px-3.5 py-2.5 text-base text-[#F4F6FF] placeholder-[#9AA0D4] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#FFCB05]">
                </div>

                <div class="flex flex-1 flex-col gap-1.5 sm:basis-[200px]">
                    <label for="filtro" class="text-[0.85rem] font-semibold text-[#C7CCEE]">Filtrar por tipo</label>
                    <select id="filtro" class="w-full rounded-[10px] bg-[#2C3161] px-3.5 py-2.5 text-base text-[#F4F6FF] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#FFCB05]">
                        <option value="">Todos los tipos</option>
                        <option value="fire">Fuego</option>
                        <option value="water">Agua</option>
                        <option value="grass">Planta</option>
                        <option value="electric">Eléctrico</option>
                        <option value="psychic">Psíquico</option>
                        <option value="rock">Roca</option>
                    </select>
                </div>

                <button type="submit" class="w-full rounded-[10px] bg-[#FFCB05] px-7 py-3 text-base font-bold text-[#1F2340] transition-transform hover:-translate-y-0.5 hover:bg-[#FFE066] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#FFCB05] sm:w-auto">
                    Buscar
                </button>
            </form>
        </section>

        <section id="favoritos" class="mt-6">
            <h2 class="text-[1.6rem] font-bold">Pokémon</h2>
            <div id="grilla-pokemon" class="mt-6 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
            </div>
        </section>
    </main>

    <footer id="acerca" class="bg-[#1F2340] p-8 text-center text-[0.9rem] text-[#C7CCEE]">
        <p>Creado por: Jose Seir Victoria</p>
        <p>Curso: Desarrollo Web</p>
        <p><a href="https://pokeapi.co/" target="_blank" rel="noopener noreferrer" class="text-[#FFCB05] hover:underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#FFCB05]">Documentación de PokéAPI</a></p>
    </footer>

    <!-- MODAL -->
    <dialog id="modal-detalle" aria-labelledby="modal-nombre" class="m-auto w-full max-w-sm overflow-hidden rounded-[28px] bg-[#EDEFF3] p-0 shadow-2xl backdrop:bg-[#1F2340]/70 backdrop:backdrop-blur-sm">
        <div class="bg-white p-8 text-center">
            <span id="modal-tipo" class="mb-3 inline-block rounded-full bg-slate-200 px-3 py-1 text-[0.75rem] font-bold tracking-[0.3px]">Tipo</span>
            <img id="modal-img" src="" alt="" class="mx-auto max-w-[180px]">
        </div>
        <div class="p-6 text-center text-[#1F2340]">
            <h2 id="modal-nombre" class="mb-2 text-[2rem] font-bold">Nombre</h2>
            <p id="modal-descripcion" class="text-[0.95rem] text-[#47496B]">Descripción del Pokémon</p>
            <form method="dialog" class="mt-6">
                <button class="w-full rounded-[10px] bg-[#FFCB05] py-2.5 font-bold text-[#1F2340] transition hover:bg-[#FFE066]">Cerrar</button>
            </form>
        </div>
    </dialog>

    <script type="module" src="js/main.js"></script>
</body>
</html>
